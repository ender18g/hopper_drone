services:
  hopper-site:
    container_name: hopper-site
    image: hopper-site:latest
    build:
      context: https://github.com/ender18g/hopper_drone.git#main
      dockerfile: pi_files/Dockerfile
    ports:
      - "80:3000"
    restart: unless-stopped
    init: true
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
