name: Build and release Hopper Studio downloads

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows portable app
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test desktop web app
        run: npm run build:desktop

      - name: Package Windows executable
        run: npx electron-builder --projectDir desktop --config electron-builder.config.cjs --win portable --x64
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Upload Windows release file
        uses: actions/upload-artifact@v7
        with:
          name: hopper-studio-windows
          path: desktop-release/*.exe
          if-no-files-found: error

  macos:
    name: macOS apps
    runs-on: macos-latest
    env:
      HAS_MAC_CERT: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' }}
      HAS_MAC_NOTARY: ${{ secrets.MAC_CSC_LINK != '' && secrets.MAC_CSC_KEY_PASSWORD != '' && secrets.APPLE_ID != '' && secrets.APPLE_APP_SPECIFIC_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build and test desktop web app
        run: npm run build:desktop

      - name: Package unsigned macOS app
        if: env.HAS_MAC_CERT != 'true'
        run: npx electron-builder --projectDir desktop --config electron-builder.config.cjs --mac zip --x64 --arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Package signed macOS app
        if: env.HAS_MAC_CERT == 'true' && env.HAS_MAC_NOTARY != 'true'
        run: npx electron-builder --projectDir desktop --config electron-builder.config.cjs --mac zip --x64 --arm64 -c.mac.hardenedRuntime=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}

      - name: Package signed and notarized macOS app
        if: env.HAS_MAC_NOTARY == 'true'
        run: npx electron-builder --projectDir desktop --config electron-builder.config.cjs --mac zip --x64 --arm64 -c.mac.hardenedRuntime=true -c.mac.notarize=true
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Upload macOS release file
        uses: actions/upload-artifact@v7
        with:
          name: hopper-studio-macos
          path: desktop-release/*.zip
          if-no-files-found: error

  local-server:
    name: Local server ZIP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build local server website
        run: npm run build:local-server

      - name: Package local server ZIP
        shell: bash
        run: |
          cd local-server-release
          zip -r ../Hopper-Studio-Local-Server.zip Hopper-Studio-Local-Server

      - name: Upload local server release file
        uses: actions/upload-artifact@v7
        with:
          name: hopper-studio-local-server
          path: Hopper-Studio-Local-Server.zip
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [windows, macos, local-server]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Load shared app name
        shell: bash
        run: echo "STUDIO_NAME=$(jq -r .studioName config/branding.json)" >> "$GITHUB_ENV"

      - name: Download packaged apps
        uses: actions/download-artifact@v7
        with:
          path: release-assets
          merge-multiple: true

      - name: Write release checksums
        shell: bash
        run: sha256sum release-assets/* > release-assets/SHA256SUMS.txt

      - name: Create release for this push
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REPOSITORY: ${{ github.repository }}
        run: |
          tag="desktop-${RUN_NUMBER}-${RUN_ATTEMPT}"
          gh release create "$tag" release-assets/* \
            --repo "$REPOSITORY" \
            --target "$COMMIT_SHA" \
            --title "${STUDIO_NAME} ${RUN_NUMBER}.${RUN_ATTEMPT}" \
            --notes "Windows: download the portable .exe (no installation or administrator access). macOS: download the arm64 ZIP for Apple Silicon or the x64 ZIP for Intel, then open the ${STUDIO_NAME} .app inside. Local server: download Hopper-Studio-Local-Server.zip, extract it, and use the included one-click Mongoose launcher; the site opens at http://localhost:8000/. Builds are signed when the repository signing secrets are configured." \
            --latest
